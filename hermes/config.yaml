# API Mistral (UE) pour l'agent principal : /model custom:mistral:mistral-medium-latest
# Clé : MISTRAL_API_KEY du .env (29/09/2026, ticket Blueseatra #88).
providers:
  mistral:
    name: Mistral AI
    api: https://api.mistral.ai/v1
    key_env: MISTRAL_API_KEY
    transport: chat_completions
    default_model: mistral-medium-latest
    models:
      mistral-medium-latest: { context_length: 128000 }
      mistral-large-latest: { context_length: 128000 }
      mistral-small-latest: { context_length: 128000 }

gateway:
  api_server:
    enabled: true
    host: "0.0.0.0"
    port: 8642
    # 29/09/2026 : 1 refusait en HTTP 429 (« Too many concurrent runs (max 1) »)
    # toute requête arrivant pendant une autre (OCR de 3 min, essai bloqué),
    # et le SaaS échouait. Ollama met lui-même les requêtes en file
    # (OLLAMA_NUM_PARALLEL=1) : Hermès accepte donc 4 runs et laisse attendre.
    max_concurrent_runs: 4
