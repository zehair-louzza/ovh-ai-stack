# Hermes Agent — modèles locaux uniquement (aucun appel cloud).
# Docs officielles :
#   https://hermes-agent.nousresearch.com/docs/user-guide/configuration
#   https://hermes-agent.nousresearch.com/docs/user-guide/configuring-models
#   https://hermes-agent.nousresearch.com/docs/user-guide/features/delegation
#   https://hermes-agent.nousresearch.com/docs/user-guide/features/fallback-providers
#
# Hermes n'a pas de slots nommés extraction / génération / raisonnement.
# Mapping Blueseatra v2 → clés documentées (ADR-003) :
#   raisonnement              →  model (principal) + agent.reasoning_effort
#                                « what the agent thinks with »
#   extraction / tâches légères →  delegation + auxiliary.web_extract (+ slots rapides)
#   génération SaaS           →  FastAPI → Ollama (ia.blueseatra.com), pas ce fichier
#
# --- Historique du repointage (23/08, 3 itérations, chacune testée en réel) ---
#
# 1) Constat initial : gemma4:26b (principal), qwen3.6:27b (1er secours) et
#    qwen2.5:14b (2e secours + 8 slots auxiliaires) ne sont installés nulle
#    part (`ollama show <modele>` -> "model not found" sur les trois). Seul
#    le dernier maillon de secours, hermes3, répondait réellement.
#
# 2) 1re correction : repointé le principal + vision sur qwen2.5vl:7b
#    (multimodal) en pensant profiter d'un seul modèle pour les deux rôles.
#    ERREUR — détectée par un test réel /v1/chat/completions juste après
#    déploiement : Hermes envoie systématiquement un paramètre "tools" à
#    chaque appel (skills, MCP...) ; qwen2.5vl:7b n'a pas cette capacité et
#    rejette la requête en HTTP 400 ("does not support tools").
#
# 3) 2e correction : repointé le principal sur qwen2.5:7b (qui a bien
#    "tools"). ERREUR encore — nouveau test réel : Hermes exige un contexte
#    minimum de 64 000 tokens pour le modèle principal, or qwen2.5:7b n'en
#    déclare que 32 768 (rejeté avec HTTP 500 "context window ... below the
#    minimum 64,000 required by Hermes Agent").
#
# Capacités et contexte réels de chaque modèle installé (`ollama show`) :
#   qwen2.5:7b    -> tools,  contexte 32 768   (insuffisant pour Hermes)
#   qwen2.5vl:7b  -> vision, contexte 128 000  (pas de "tools")
#   hermes3       -> tools,  contexte 131 072  (seul modèle qui satisfait
#                                               tools ET >= 64K)
#
# État final : hermes3 partout où un appel agentique/texte est nécessaire
# (principal, tous les slots auxiliaires texte, delegation) ; qwen2.5vl:7b
# réservé au seul slot vision, faute d'alternative avec "tools". Aucun
# modèle installé ne cumule tools + vision + contexte suffisant — un appel
# vision recharge donc Ollama (OLLAMA_MAX_LOADED_MODELS=1), c'est inévitable
# avec le matériel actuel.
#
# glm-ocr, LightOnOCR-2:1b, olmocr2:7b, PaddleOCR-VL-1.6 : modèles de
# transcription pure (pas d'instruction-following), utilisés uniquement en
# secours du slot vision (voir auxiliary.vision) ou dans la cascade OCR
# FastAPI (ai_service.py, PR #45) — jamais pour un slot texte/agentique.
#
# provider: auto interdit (la découverte auxiliaire tenterait OpenRouter /
# Nous Portal).
#
# Raisonnement (agent.reasoning_effort) : au 23/08, aucun modèle installé ne
# figurait dans la liste des modèles « thinking » supportés par Ollama
# (DeepSeek R1, Qwen 3, GPT-OSS, DeepSeek-v3.1 —
# https://docs.ollama.com/capabilities/thinking) autre que gpt-oss:20b, déjà
# repointé sur "high" (voir bloc agent ci-dessous). Un effort "high"/"medium"
# reste donc explicitement "none" pour tout slot auxiliaire qui n'a pas de
# raisonnement natif confirmé — pas de contrôle fantôme. Noter le bug connu
# de Hermes sur provider "custom"
# (https://github.com/NousResearch/hermes-agent/issues/25758) :
# reasoning_effort: none n'est fiable que sur les modèles qui ne pensent pas
# nativement, pas comme mécanisme de désactivation d'un modèle "thinking".
#
# 2026-08-25 : glm-4.7-flash:Q3_K_M installé et testé en réel hors du gateway
# Hermes (appel direct /api/chat) -- `ollama show` confirme completion, tools,
# thinking natif ; think=true/false accepté proprement en BOOLÉEN (pas de
# support gradué "low"/"medium"/"high" essayé ni confirmé, à la différence de
# gpt-oss). La doc officielle Hermes (reasoning_effort: none/minimal/low/
# medium/high/xhigh/max/ultra) NE PRÉCISE PAS comment ce réglage se traduit
# pour un modèle Ollama à réflexion booléenne -- ni le champ Ollama natif
# "think", ni sa traduction éventuelle en true/false n'y sont documentés.
# "high" ci-dessous est donc un choix motivé (cohérent avec ADR-007, "tout
# est actif") mais NON VÉRIFIÉ à ce niveau -- seul un test réel via le gateway
# Hermes lui-même (pas un appel Ollama direct) confirmera si ce champ active
# effectivement le raisonnement du modèle ou est ignoré silencieusement.

# Forme officielle : model est un mapping (provider, default, base_url, api_mode).
# https://hermes-agent.nousresearch.com/docs/user-guide/configuring-models
# https://hermes-agent.nousresearch.com/docs/user-guide/configuration
# provider: custom obligatoire pour un endpoint OpenAI-compatible local.
model:
  provider: custom
  # 2026-08-25 : glm-4.7-flash:Q3_K_M devient le modele PRINCIPAL de l'agent
  # (demande explicite de l'utilisateur, teste en reel avant ce changement --
  # voir commentaire agent.reasoning_effort ci-dessous). `ollama show` confirme
  # tools + contexte 202752 (bien au-dessus du minimum 64K exige par Hermes
  # pour le modele principal -- exactement les deux contraintes qui avaient
  # fait echouer qwen2.5vl:7b (pas de tools) et qwen2.5:7b (contexte 32K) le
  # 23/08, voir historique ci-dessus). gpt-oss:20b (ex-principal) reste
  # installe et devient repli (voir fallback_providers plus bas).
  default: glm-4.7-flash:Q3_K_M
  base_url: http://ollama:11434/v1
  api_key: ollama-local
  api_mode: chat_completions

# glm-4.7-flash:Q3_K_M PENSE nativement (thinking confirme via `ollama show`,
# teste en reel avec think=true/false booleen -- voir commentaire plus haut).
# "high" pour la conversation devis principale (raisonnement maximal,
# demande explicite le 25/08, coherent avec ADR-007) -- MAIS non verifie a
# travers le gateway Hermes lui-meme (voir avertissement ci-dessus) : a
# confirmer par un test reel post-deploiement avant de considerer ce
# reglage fiable. Chaque slot auxiliaire ci-dessous choisit son propre
# niveau selon la nature de sa tache (voir commentaires par slot, tous
# encore sur gpt-oss:20b) et n'est PAS affecte par ce changement.
agent:
  # 2026-08-23 (revu) : "high" au lieu de "medium" -- demande explicite de
  # l'utilisateur, raisonnement maximal privilegie sur la vitesse. Mesure
  # le meme jour (prompt trivial, VPS CPU-only) : "high" ~12.3s contre
  # ~8.9s en "medium" ; l'ecart reel sur un devis complet sera plus grand.
  # Voir ADR-007.
  reasoning_effort: high
  # 2026-08-23 (revu) : tous les toolsets reactives (memory, session_search,
  # code_execution, delegation, tts, todo) -- demande explicite de
  # l'utilisateur (voir ADR-007), malgre l'avertissement donne et accepte sur
  # code_execution specifiquement : ce toolset donne a l'agent une capacite
  # de calcul propre, ce qui va a l'encontre de la regle "FastAPI seul moteur
  # de prix, l'IA n'invente jamais de prix" documentee dans
  # devis-options-master et securite-donnees-devis. Cette regle reste en
  # vigueur au niveau skill/instruction (SOUL.md, devis-options-master) :
  # reactiver le toolset ne change pas la consigne donnee au modele de ne
  # jamais calculer de prix lui-meme, seulement sa capacite technique de le
  # faire s'il l'ignorait -- risque accepte explicitement par l'utilisateur.
  # Pas de cle disabled_toolsets : tous les toolsets Hermes sont actifs
  # (memory, session_search, code_execution, delegation, tts, todo, file,
  # skills, clarify, browser, terminal, vision).
  # https://hermes-agent.nousresearch.com/docs/user-guide/configuration#global-toolset-disable


# gpt-oss:20b (ex-principal jusqu'au 25/08) satisfait tools + contexte 64K et
# a un raisonnement natif confirme : repli de premier rang si glm-4.7-flash
# echoue (OOM, timeout, ou le champ reasoning_effort s'avere mal traduit
# pour un modele booleen -- voir avertissement plus haut). hermes3 reste en
# dernier recours (tools + contexte 64K/131072, mais dense 8B sans MoE ni
# raisonnement natif, donc plus lent et moins fiable sur un devis complexe).
fallback_providers:
  - provider: custom
    model: gpt-oss:20b
    base_url: http://ollama:11434/v1
    key_env: OPENAI_API_KEY
  - provider: custom
    model: hermes3
    base_url: http://ollama:11434/v1
    key_env: OPENAI_API_KEY

auxiliary:
  # Slot d'extraction documenté (pas de clé "extraction"). "medium" : une
  # extraction de tableau dense bénéficie de la réflexion (même logique que
  # la décision Gemma+raisonnement documentée dans le skill
  # intake-demande-devis pour les fichiers importés).
  web_extract:
    provider: main
    model: gpt-oss:20b
    base_url: http://ollama:11434/v1
    api_key: ollama-local
    timeout: 360
    reasoning_effort: medium
    max_concurrency: 1

  # "low" : simple résumé/compaction de conversation, aucune décision
  # métier -- la vitesse prime.
  compression:
    provider: main
    model: gpt-oss:20b
    base_url: http://ollama:11434/v1
    api_key: ollama-local
    reasoning_effort: low
    max_concurrency: 1

  # qwen2.5vl:7b est le SEUL modèle vision installé (gpt-oss:20b, le
  # principal, ne sait pas lire d'image — capacités "completion, tools,
  # thinking", pas "vision"). Différent du principal -> un appel vision
  # recharge Ollama (voir historique en tête de fichier). Si la lecture
  # échoue ou le document est dense/dégradé (voir skill
  # intake-demande-devis, détection de calque texte illisible), secours vers
  # les mêmes modèles de transcription pure que la cascade OCR FastAPI
  # (PR #45 ai_service.py), dans le même ordre (le plus rapide mesuré
  # d'abord) — repris ici uniquement en filet de secours : ce sont des
  # modèles de transcription pure, pas des modèles d'instruction comme les
  # autres slots auxiliaires.
  vision:
    provider: main
    model: qwen2.5vl:7b
    base_url: http://ollama:11434/v1
    api_key: ollama-local
    timeout: 120
    download_timeout: 30
    reasoning_effort: none
    max_concurrency: 1
    fallback_chain:
      - provider: custom
        model: AuditAid/PaddleOCR-VL-1.6-0.9B:latest
        base_url: http://ollama:11434/v1
        api_key: ollama-local
        timeout: 220
      - provider: custom
        model: glm-ocr:latest
        base_url: http://ollama:11434/v1
        api_key: ollama-local
        timeout: 240

  # "low" : générer un titre de conversation ne demande aucun raisonnement.
  title_generation:
    provider: main
    model: gpt-oss:20b
    base_url: http://ollama:11434/v1
    api_key: ollama-local
    reasoning_effort: low
    prefer_fast_model: true
    max_concurrency: 1

  # "low" : routage d'appel d'outil MCP, décision mécanique -- la latence
  # prime sur la profondeur de réflexion.
  mcp:
    provider: main
    model: gpt-oss:20b
    base_url: http://ollama:11434/v1
    api_key: ollama-local
    reasoning_effort: low
    max_concurrency: 1

  # "low" : recherche/installation de skill, tâche de lookup, pas de
  # raisonnement métier.
  skills_hub:
    provider: main
    model: gpt-oss:20b
    base_url: http://ollama:11434/v1
    api_key: ollama-local
    reasoning_effort: low
    max_concurrency: 1

  # "medium" : une approbation touche une action potentiellement sensible
  # (voir skill securite-donnees-devis) -- vaut la peine d'un peu plus de
  # réflexion qu'un simple routage.
  approval:
    provider: main
    model: gpt-oss:20b
    base_url: http://ollama:11434/v1
    api_key: ollama-local
    reasoning_effort: medium
    max_concurrency: 1

  # "low" : classification/routage rapide, pas de calcul ni de décision
  # métier finale.
  triage_specifier:
    provider: main
    model: gpt-oss:20b
    base_url: http://ollama:11434/v1
    api_key: ollama-local
    reasoning_effort: low
    max_concurrency: 1

# Sous-agents = extraction / tâches simples (pattern planner / workers).
# max_concurrent_children: 1 car Ollama n'a qu'un modèle chargé.
delegation:
  base_url: http://ollama:11434/v1
  api_key: ollama-local
  model: gpt-oss:20b
  api_mode: chat_completions
  max_concurrent_children: 1
  worktree_isolation: false
  max_spawn_depth: 1
  orchestrator_enabled: false

# API chat OpenAI-compatible (port 8642). La clé reste dans .env (API_SERVER_KEY).
# Env Compose prime sur ce bloc.
# https://hermes-agent.nousresearch.com/docs/user-guide/features/api-server
gateway:
  api_server:
    enabled: true
    host: "0.0.0.0"
    port: 8642
    max_concurrent_runs: 1
