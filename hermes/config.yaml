# Hermes Agent — modèles locaux uniquement (aucun appel cloud).
# Docs officielles :
#   https://hermes-agent.nousresearch.com/docs/user-guide/configuration
#   https://hermes-agent.nousresearch.com/docs/user-guide/configuring-models
#   https://hermes-agent.nousresearch.com/docs/user-guide/features/delegation
#   https://hermes-agent.nousresearch.com/docs/user-guide/features/fallback-providers
#
# Hermes n'a pas de slots nommés extraction / génération / raisonnement.
# Mapping Blueseatra v2 → clés documentées (ADR-003) :
#   raisonnement              →  model (principal) + agent.reasoning_effort
#                                « what the agent thinks with »
#   extraction / tâches légères →  delegation + auxiliary.web_extract (+ slots rapides)
#   génération SaaS           →  FastAPI → Ollama (ia.blueseatra.com), pas ce fichier
#
# 2026-08-23 : repointage vers les modèles réellement présents sur le VPS
# (vérifié via `ollama list` — gemma4:26b / qwen3.6:27b / qwen2.5:14b n'ont
# JAMAIS été installés, seule une tentative d'installation de Gemma 4 26B-A4B
# avait été entamée sans jamais aboutir ; ce fichier pointait donc dans le
# vide depuis le début — seul le tout dernier maillon de secours, hermes3,
# répondait réellement). Modèles disponibles ce jour :
#   glm-ocr, qwen2.5vl:7b, qwen2.5:7b, LightOnOCR-2:1b, olmocr2:7b,
#   PaddleOCR-VL-1.6, hermes3/hermes-3.
# Repris qwen2.5vl:7b / qwen2.5:7b / hermes3 : mêmes modèles déjà en
# production côté FastAPI (PR #44, ai_service.py) — cohérence entre les deux
# services plutôt que d'introduire une troisième famille de modèles.
# Vision = même modèle que le principal (qwen2.5vl:7b est nativement
# multimodal) : évite un rechargement Ollama à chaque appel vision alors
# qu'OLLAMA_MAX_LOADED_MODELS=1 (un seul modèle en RAM à la fois).
# provider: auto interdit (la découverte auxiliaire tenterait OpenRouter /
# Nous Portal).
#
# Raisonnement (agent.reasoning_effort) : qwen2.5 et qwen2.5-vl ne figurent
# PAS dans la liste des modèles « thinking » supportés par Ollama (DeepSeek
# R1, Qwen 3, GPT-OSS, DeepSeek-v3.1— https://docs.ollama.com/capabilities/thinking).
# Un effort "high"/"medium" serait donc silencieusement sans effet sur ces
# modèles : réglé explicitement sur "none" partout pour ne pas laisser croire
# à un contrôle qui n'existe pas. Si un modèle "thinking" (ex. Qwen 3) est
# installé un jour, revoir ce réglage — et noter le bug connu de Hermes sur
# provider "custom" (https://github.com/NousResearch/hermes-agent/issues/25758) :
# reasoning_effort: none n'est fiable que sur les modèles qui ne pensent pas
# nativement, pas comme mécanisme de désactivation d'un modèle "thinking".

# Forme officielle : model est un mapping (provider, default, base_url, api_mode).
# https://hermes-agent.nousresearch.com/docs/user-guide/configuring-models
# https://hermes-agent.nousresearch.com/docs/user-guide/configuration
# provider: custom obligatoire pour un endpoint OpenAI-compatible local.
model:
  provider: custom
  default: qwen2.5vl:7b
  base_url: http://ollama:11434/v1
  api_key: ollama-local
  api_mode: chat_completions

# qwen2.5vl:7b n'est pas un modèle "thinking" (voir note ci-dessus) : aucun
# reasoning_overrides nécessaire, "none" partout par défaut.
agent:
  reasoning_effort: none

# Si le modèle principal échoue (OOM, timeout), bascule locale uniquement.
fallback_providers:
  - provider: custom
    model: qwen2.5:7b
    base_url: http://ollama:11434/v1
    key_env: OPENAI_API_KEY
  - provider: custom
    model: hermes3
    base_url: http://ollama:11434/v1
    key_env: OPENAI_API_KEY

auxiliary:
  # Slot d'extraction documenté (pas de clé "extraction").
  web_extract:
    provider: main
    model: qwen2.5:7b
    base_url: http://ollama:11434/v1
    api_key: ollama-local
    timeout: 360
    reasoning_effort: none
    max_concurrency: 1
    fallback_chain:
      - provider: custom
        model: hermes3
        base_url: http://ollama:11434/v1
        api_key: ollama-local

  compression:
    provider: main
    model: qwen2.5:7b
    base_url: http://ollama:11434/v1
    api_key: ollama-local
    reasoning_effort: none
    max_concurrency: 1
    fallback_chain:
      - provider: custom
        model: hermes3
        base_url: http://ollama:11434/v1
        api_key: ollama-local

  # qwen2.5vl:7b accepte texte + image — rester sur le principal pour éviter
  # un rechargement (un seul modèle chargé en RAM à la fois).
  vision:
    provider: main
    model: qwen2.5vl:7b
    base_url: http://ollama:11434/v1
    api_key: ollama-local
    timeout: 120
    download_timeout: 30
    reasoning_effort: none
    max_concurrency: 1

  title_generation:
    provider: main
    model: qwen2.5:7b
    base_url: http://ollama:11434/v1
    api_key: ollama-local
    reasoning_effort: none
    prefer_fast_model: true
    max_concurrency: 1

  mcp:
    provider: main
    model: qwen2.5:7b
    base_url: http://ollama:11434/v1
    api_key: ollama-local
    reasoning_effort: none
    max_concurrency: 1

  skills_hub:
    provider: main
    model: qwen2.5:7b
    base_url: http://ollama:11434/v1
    api_key: ollama-local
    reasoning_effort: none
    max_concurrency: 1

  approval:
    provider: main
    model: qwen2.5:7b
    base_url: http://ollama:11434/v1
    api_key: ollama-local
    reasoning_effort: none
    max_concurrency: 1

  triage_specifier:
    provider: main
    model: qwen2.5:7b
    base_url: http://ollama:11434/v1
    api_key: ollama-local
    reasoning_effort: none
    max_concurrency: 1

# Sous-agents = extraction / tâches simples (pattern planner / workers).
# max_concurrent_children: 1 car Ollama n'a qu'un modèle chargé.
delegation:
  base_url: http://ollama:11434/v1
  api_key: ollama-local
  model: qwen2.5:7b
  api_mode: chat_completions
  max_concurrent_children: 1
  worktree_isolation: false
  max_spawn_depth: 1
  orchestrator_enabled: false

# API chat OpenAI-compatible (port 8642). La clé reste dans .env (API_SERVER_KEY).
# Env Compose prime sur ce bloc.
# https://hermes-agent.nousresearch.com/docs/user-guide/features/api-server
gateway:
  api_server:
    enabled: true
    host: "0.0.0.0"
    port: 8642
    max_concurrent_runs: 1
