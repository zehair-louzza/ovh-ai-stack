# Hermes Agent — modèles locaux uniquement (aucun appel cloud).
# Docs officielles :
#   https://hermes-agent.nousresearch.com/docs/user-guide/configuration
#   https://hermes-agent.nousresearch.com/docs/user-guide/configuring-models
#   https://hermes-agent.nousresearch.com/docs/user-guide/features/delegation
#   https://hermes-agent.nousresearch.com/docs/user-guide/features/fallback-providers
#
# Hermes n'a pas de slots nommés extraction / génération / raisonnement.
# Mapping Blueseatra v2 → clés documentées :
#   génération + raisonnement  →  model (principal) + agent.reasoning_effort
#   extraction / tâches légères →  delegation + auxiliary.web_extract (+ slots rapides)
# Vision reste sur le 27B : aucun modèle VL dédié n'est installé.
# Gemma 4 26B-A4B / DeepSeek-R1 32B : non installés — ne pas les pointer.
# OLLAMA_MAX_LOADED_MODELS=1 : un seul modèle en RAM. provider: auto interdit
# (la découverte auxiliaire tenterait OpenRouter / Nous Portal).

model: qwen3.6:27b
provider: custom
base_url: http://ollama:11434/v1
api_key: ollama-local

# Raisonnement = effort du modèle principal, pas un slot dédié.
# Vide = medium. high = contrôle matériaux / lots avant génération.
agent:
  reasoning_effort: high
  reasoning_overrides:
    "qwen3.6:27b": high
    "qwen2.5:14b": none
    "hermes3": none
    "hermes-3": none

# Si le 27B échoue (OOM, timeout), bascule locale uniquement.
fallback_providers:
  - provider: custom
    model: qwen2.5:14b
    base_url: http://ollama:11434/v1
    key_env: OPENAI_API_KEY
  - provider: custom
    model: hermes3
    base_url: http://ollama:11434/v1
    key_env: OPENAI_API_KEY

auxiliary:
  # Slot d'extraction documenté (pas de clé "extraction").
  web_extract:
    provider: main
    model: qwen2.5:14b
    base_url: http://ollama:11434/v1
    api_key: ollama-local
    timeout: 360
    reasoning_effort: none
    max_concurrency: 1
    fallback_chain:
      - provider: custom
        model: hermes3
        base_url: http://ollama:11434/v1
        api_key: ollama-local

  compression:
    provider: main
    model: qwen2.5:14b
    base_url: http://ollama:11434/v1
    api_key: ollama-local
    reasoning_effort: low
    max_concurrency: 1
    fallback_chain:
      - provider: custom
        model: hermes3
        base_url: http://ollama:11434/v1
        api_key: ollama-local

  # Pas de modèle vision installé : rester sur le principal.
  vision:
    provider: main
    model: qwen3.6:27b
    base_url: http://ollama:11434/v1
    api_key: ollama-local
    timeout: 120
    download_timeout: 30
    reasoning_effort: low
    max_concurrency: 1

  title_generation:
    provider: main
    model: qwen2.5:14b
    base_url: http://ollama:11434/v1
    api_key: ollama-local
    reasoning_effort: none
    prefer_fast_model: true
    max_concurrency: 1

  mcp:
    provider: main
    model: qwen2.5:14b
    base_url: http://ollama:11434/v1
    api_key: ollama-local
    reasoning_effort: none
    max_concurrency: 1

  skills_hub:
    provider: main
    model: qwen2.5:14b
    base_url: http://ollama:11434/v1
    api_key: ollama-local
    reasoning_effort: none
    max_concurrency: 1

  approval:
    provider: main
    model: qwen2.5:14b
    base_url: http://ollama:11434/v1
    api_key: ollama-local
    reasoning_effort: none
    max_concurrency: 1

  triage_specifier:
    provider: main
    model: qwen2.5:14b
    base_url: http://ollama:11434/v1
    api_key: ollama-local
    reasoning_effort: none
    max_concurrency: 1

# Sous-agents = extraction / tâches simples (pattern planner / workers).
# max_concurrent_children: 1 car Ollama n'a qu'un modèle chargé.
delegation:
  base_url: http://ollama:11434/v1
  api_key: ollama-local
  model: qwen2.5:14b
  api_mode: chat_completions
  max_concurrent_children: 1
  worktree_isolation: false
  max_spawn_depth: 1
  orchestrator_enabled: false
