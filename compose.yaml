# ovh-ai-stack — Ollama + Hermes Agent + n8n derrière Caddy
# Images officielles :
#   Ollama  https://docs.ollama.com/docker
#   Hermes  https://hermes-agent.nousresearch.com/docs/user-guide/docker
#   n8n     https://docs.n8n.io/deploy/host-n8n/install-options/use-a-cloud-provider/use-docker-compose
#   Caddy   https://hub.docker.com/_/caddy
#
# Aucun service applicatif n'est publié sur 0.0.0.0 sauf Caddy :80/:443.

name: ovh-ai-stack

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: false

volumes:
  ollama_data:
  n8n_data:
  hermes_data:
  caddy_data:
  caddy_config:

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file:
      - .env
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      N8N_HOST: ${N8N_HOST}
      HERMES_HOST: ${HERMES_HOST}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ollama
      - n8n
      - hermes
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Pas de ports: publics. Accessible uniquement via le réseau Docker + Caddy.
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_CONTEXT_LENGTH: 8192
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - backend
    mem_limit: 18g
    memswap_limit: 20g
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOST}/
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Paris}
      TZ: ${GENERIC_TIMEZONE:-Europe/Paris}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 2000
      N8N_SECURE_COOKIE: "true"
      NODE_ENV: production
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-files:/files
    networks:
      - backend
    depends_on:
      - ollama
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"

  hermes:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    command: ["gateway", "run"]
    env_file:
      - .env
    environment:
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://ollama:11434/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama-local}
      HERMES_MODEL: ${HERMES_MODEL:-gemma4:26b}
      HERMES_DASHBOARD: "0"
      # API OpenAI-compatible. 0.0.0.0 = joignable par Caddy (réseau Docker).
      # Ne pas publier 8642 sur l'hôte : seul Caddy expose hermes.blueseatra.com.
      # https://hermes-agent.nousresearch.com/docs/user-guide/docker
      # https://hermes-agent.nousresearch.com/docs/user-guide/features/api-server
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: ${API_SERVER_KEY:?définir API_SERVER_KEY dans .env}
    volumes:
      - hermes_data:/opt/data
      - ./hermes/config.yaml:/opt/data/config.yaml:ro
      - ./hermes/SOUL.md:/opt/data/SOUL.md:ro
      - ./hermes/skills:/opt/data/skills:ro
    networks:
      - backend
    depends_on:
      ollama:
        condition: service_healthy
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
