# ovh-ai-stack — Ollama + Hermes Agent + n8n derrière Caddy
# Images officielles :
#   Ollama  https://docs.ollama.com/docker
#   Hermes  https://hermes-agent.nousresearch.com/docs/user-guide/docker
#   n8n     https://docs.n8n.io/deploy/host-n8n/install-options/use-a-cloud-provider/use-docker-compose
#   Caddy   https://hub.docker.com/_/caddy
#
# Aucun service applicatif n'est publié sur 0.0.0.0 sauf Caddy :80/:443.

name: ovh-ai-stack

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: false

volumes:
  ollama_data:
  n8n_data:
  hermes_data:
  hermes_passerelle_data:
  caddy_data:
  caddy_config:

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file:
      - .env
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      N8N_HOST: ${N8N_HOST}
      HERMES_HOST: ${HERMES_HOST}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      API_SERVER_KEY: ${API_SERVER_KEY}
      HERMES_WEB_USER: ${HERMES_WEB_USER:-hermes-admin}
      # Défaut = hachage d'un secret aléatoire jeté : accès web fermé tant que
      # scripts/activer-hermes.sh n'a pas été lancé (Caddy démarre quand même).
      HERMES_WEB_HASH: ${HERMES_WEB_HASH:-JDJhJDE0JFhOVDJWb2pGOXNqV1hKa1QwQi5GbU9uaG54eXNFeWo2bDhTREUyeXJCSXJmOFA0aE9QNHFPCg==}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ollama
      - n8n
      - hermes
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Pas de ports: publics. Accessible uniquement via le réseau Docker + Caddy.
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # 30m au lieu de 10m : Gemma (17 Go, CPU seul) est desormais le modele
      # d'extraction par defaut pour tout fichier importe. OLLAMA_MAX_LOADED_MODELS=1
      # force un rechargement complet (~20s) a chaque alternance avec un autre
      # modele ; un keep_alive plus long evite ce rechargement pendant une
      # session de traitement de plusieurs devis rapprochees.
      # 2026-08-19 : dechargement immediat (0) -- le keep_alive de 30m puis
      # 5m maintenait encore un modele charge en RAM meme totalement inactif,
      # sur un VPS a 22 Go sans marge (598 Mo libres observes avec Gemma
      # 17 Go charge). OLLAMA_MAX_LOADED_MODELS=1 garantit DEJA qu'un modele
      # different force le dechargement du precedent avant de charger le
      # nouveau, quelle que soit la valeur de keep_alive : ce reglage ne
      # concerne que l'inactivite totale (aucune requete du tout).
      #
      # 2026-08-23 : retour a 30m -- avec gpt-oss:20b comme modele principal
      # (14 Go, plus leger que Gemma), la marge mesuree est confortable
      # (~6-7 Go libres apres chargement, contre 598 Mo avec Gemma). Chaque
      # rechargement complet depuis le disque coute ~30-40s ; keep_alive=0
      # payait ce cout a chaque appel, y compris deux appels rapproches du
      # meme agent. Teste en reel : deux appels consecutifs a chaud gagnent
      # ~10-15% de temps total (rechargement evite) par rapport a
      # keep_alive=0, sans effet secondaire observe. Le gain de reutilisation
      # du cache de contexte d'Ollama, lui, ne se materialise pas en usage
      # reel car chaque devis pose une question differente (voir l'analyse
      # dans hermes/config.yaml, section agent.disabled_toolsets) -- seul le
      # gain "pas de rechargement modele" est retenu ici.
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_CONTEXT_LENGTH: 8192
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - backend
    mem_limit: 18g
    memswap_limit: 20g
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOST}/
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Paris}
      TZ: ${GENERIC_TIMEZONE:-Europe/Paris}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 2000
      N8N_SECURE_COOKIE: "true"
      NODE_ENV: production
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-files:/files
    networks:
      - backend
    depends_on:
      - ollama
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"

  hermes:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    command: ["gateway", "run"]
    env_file:
      - .env
    environment:
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://ollama:11434/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama-local}
      HERMES_MODEL: ${HERMES_MODEL:-gpt-oss:20b}
      # Tableau de bord web (9119, réseau interne, publié par Caddy sur
      # hermes.blueseatra.com derrière identifiant + mot de passe). Les
      # identifiants HERMES_DASHBOARD_BASIC_AUTH_* sont dans .env.
      HERMES_DASHBOARD: "1"
      # API Mistral pour l'agent principal (providers.mistral de config.yaml).
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      # API OpenAI-compatible. 0.0.0.0 = joignable par Caddy (réseau Docker).
      # Ne pas publier 8642 sur l'hôte : seul Caddy expose hermes.blueseatra.com.
      # https://hermes-agent.nousresearch.com/docs/user-guide/docker
      # https://hermes-agent.nousresearch.com/docs/user-guide/features/api-server
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: ${API_SERVER_KEY:?définir API_SERVER_KEY dans .env}
    volumes:
      - hermes_data:/opt/data
      - ./hermes/config.yaml:/opt/data/config.yaml:ro
      - ./hermes/SOUL.md:/opt/data/SOUL.md:ro
      - ./hermes/skills:/opt/data/skills:ro
    networks:
      - backend
    depends_on:
      ollama:
        condition: service_healthy
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true

  # Passerelle IA du SaaS Blueseatra : même image, sans outils ni mémoire
  # (hermes/passerelle/config.yaml). Seul point d'entrée IA de l'API Render.
  hermes-passerelle:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: ${API_SERVER_KEY:?définir API_SERVER_KEY dans .env}
      HERMES_DASHBOARD: "0"
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    volumes:
      - hermes_passerelle_data:/opt/data
      - ./hermes/passerelle/config.yaml:/opt/data/config.yaml:ro
    networks:
      - backend
    depends_on:
      ollama:
        condition: service_healthy
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os,urllib.request as u; u.urlopen(u.Request('http://localhost:8642/v1/models', headers={'Authorization': 'Bearer '+os.environ['API_SERVER_KEY']}), timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
